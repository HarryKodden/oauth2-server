services:
  init-certs:
    image: alpine:latest
    volumes:
      - certs:/tmp/certs
      - ./init-certs.sh:/init-certs.sh
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl curl && /init-certs.sh url=$$OAUTH_URL"]
    restart: "no"
    environment:
      - API_KEY=${API_KEY}
      - OAUTH_URL=${OAUTH_URL:-http://oauth2-server:8080}
    depends_on:
      oauth2-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/certs/hsm_ca.pem"]
      interval: 2s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: oauth2
      POSTGRES_PASSWORD: oauth2password
      POSTGRES_DB: oauth2db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oauth2"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock_provider:
    image: python:3.12-alpine
    volumes:
      - ./mock_provider.py:/app/mock_provider.py:ro
    working_dir: /app
    command: ["python3", "mock_provider.py"]
    environment:
      # Browser hits the published port; the AS calls mock_provider on the compose network.
      - ISSUER=http://localhost:9999
      - INTERNAL_BASE_URL=http://mock_provider:9999
      - PORT=9999
    ports:
      - "9999:9999"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9999/.well-known/openid-configuration', timeout=2)",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 3s

  oauth2-server:
    image: oauth2-server:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      - PUBLIC_BASE_URL=http://localhost:8080
      - PORT=8080

      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=text

      - UPSTREAM_PROVIDER_URL=${UPSTREAM_PROVIDER_URL:-http://mock_provider:9999}
      - UPSTREAM_CLIENT_ID=${UPSTREAM_CLIENT_ID:-upstream_client}
      - UPSTREAM_CLIENT_SECRET=${UPSTREAM_CLIENT_SECRET:-upstream_secret}
      - UPSTREAM_CALLBACK_URL=${UPSTREAM_CALLBACK_URL:-http://localhost:8080/callback}

      # - DATABASE_TYPE=sqlite
      # - DATABASE_PATH=/app/oauth2.db
      - DATABASE_TYPE=postgres
      - DATABASE_PATH=postgres://oauth2:oauth2password@postgres:5432/oauth2db?sslmode=disable

      - API_KEY=${API_KEY}
      - ENABLE_REGISTRATION_API=true
      - ENABLE_TRUST_ANCHOR_API=true
    depends_on:
      postgres:
        condition: service_healthy
      mock_provider:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./oauth2.db:/app/oauth2.db
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:8080/health | grep -q '\"status\":\"healthy\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  demo-app:
    image: python:3.11-alpine
    working_dir: /app
    ports:
      - "8001:8080"
    volumes:
      - certs:/tmp/certs
      - ./examples/hsm-attestation-wallet:/app
      - ./examples/hsm-attestation-wallet/generate-config.sh:/app/generate-config.sh
    command: ["/bin/sh", "-c", "chmod +x /app/generate-config.sh && /app/generate-config.sh && python3 -m http.server 8080"]
    environment:
      - API_KEY=${API_KEY}
      - HSM_DEMO_SERVER_URL=${HSM_DEMO_SERVER_URL:-http://localhost:8080}
    depends_on:
      init-certs:
        condition: service_completed_successfully
      oauth2-server:
        condition: service_healthy

volumes:
  certs:
  postgres-data:
