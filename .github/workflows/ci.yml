name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  packages: write
  pull-requests: read
  actions: read
  security-events: write

env:
  GO_VERSION: "1.25.8" # Keep stdlib security patch level up to date
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.25.8"] # Use patched Go 1.25 line

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ The following files are not formatted properly:"
            echo "$UNFORMATTED"
            echo ""
            echo "To fix this, run locally:"
            echo "  make fmt"
            echo "  git add ."
            echo "  git commit -m 'Format code'"
            echo "  git push"
            echo ""
            echo "Or run: gofmt -s -w ."
            exit 1
          fi
          echo "✅ All files are properly formatted"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build application
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/
          retention-days: 7

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build time
        run: echo "BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Set version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            SHORT_COMMIT=$(git rev-parse --short HEAD)
            VERSION="${LATEST_TAG}-rc.${SHORT_COMMIT}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # HOMELAB_DOCKER_PUSH must be enabled for registry2 — accepts true/True/1/yes/on (repository variable).
      # Registry login is optional: if HOMELAB_REGISTRY_* secrets are unset, homelab push runs without docker login
      # (suitable for open/anonymous-push homelab registries). If both secrets are set, docker/login runs first.
      - name: Detect homelab registry push
        id: homelab
        env:
          RAW: ${{ vars.HOMELAB_DOCKER_PUSH }}
          HOMELAB_USER: ${{ secrets.HOMELAB_REGISTRY_USERNAME }}
          HOMELAB_TOKEN: ${{ secrets.HOMELAB_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VL=$(printf '%s' "${RAW:-}" | tr '[:upper:]' '[:lower:]' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "HOMELAB_DOCKER_PUSH (normalized): '${VL:-}'"
          case "$VL" in
            true|1|yes|on)
              WANT=true
              ;;
            *)
              WANT=false
              ;;
          esac
          if [ "$WANT" != true ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "needs_homelab_login=false" >> "$GITHUB_OUTPUT"
            echo "registry2.homelab.kodden.nl push: DISABLED — set repository variable HOMELAB_DOCKER_PUSH to true under Settings → Secrets and variables → Actions → Variables"
            exit 0
          fi
          U_TR=$(printf '%s' "${HOMELAB_USER:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          T_TR=$(printf '%s' "${HOMELAB_TOKEN:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          if [ -n "$U_TR" ] && [ -n "$T_TR" ]; then
            echo "needs_homelab_login=true" >> "$GITHUB_OUTPUT"
            echo "registry2.homelab.kodden.nl push: ENABLED (docker login with HOMELAB_REGISTRY_* secrets)"
          else
            echo "needs_homelab_login=false" >> "$GITHUB_OUTPUT"
            echo "registry2.homelab.kodden.nl push: ENABLED (no HOMELAB_REGISTRY_* secrets — skipping docker login; push is unauthenticated if your registry allows it)"
          fi

      - name: Set container image names for tagging
        id: imagelist
        env:
          REGISTRY_HOST: ${{ env.REGISTRY }}
          IMAGE_NAME_SLUG: ${{ env.IMAGE_NAME }}
          HOMELAB_ENABLED: ${{ steps.homelab.outputs.enabled }}
          HOMELAB_IMAGE_PATH: ${{ vars.HOMELAB_IMAGE_PATH }}
        run: |
          set -euo pipefail
          {
            echo "${REGISTRY_HOST}/${IMAGE_NAME_SLUG}"
            if [ "${HOMELAB_ENABLED}" = "true" ]; then
              P="${HOMELAB_IMAGE_PATH:-harry/oauth2-server}"
              echo "registry2.homelab.kodden.nl/${P}"
            fi
          } > /tmp/images.txt
          echo "images<<IMGLISTEOF" >> "$GITHUB_OUTPUT"
          cat /tmp/images.txt >> "$GITHUB_OUTPUT"
          echo "IMGLISTEOF" >> "$GITHUB_OUTPUT"
          echo "Image destinations:"
          cat /tmp/images.txt

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to homelab container registry
        if: ${{ github.event_name != 'pull_request' && steps.homelab.outputs.enabled == 'true' && steps.homelab.outputs.needs_homelab_login == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: registry2.homelab.kodden.nl
          username: ${{ secrets.HOMELAB_REGISTRY_USERNAME }}
          password: ${{ secrets.HOMELAB_REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imagelist.outputs.images }}
          tags: |
            # Branch-based tags
            type=ref,event=branch
            type=ref,event=pr
            # Semantic versioning tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # Git commit tags
            type=sha,prefix=${{ github.ref_name }}-
            # Latest tag for main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Date-based tag for easier tracking
            type=schedule,pattern={{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.title=OAuth2 Server
            org.opencontainers.image.description=Enterprise OAuth2 Authorization Server with Attestation Support
            org.opencontainers.image.vendor=HarryKodden
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.VERSION }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, build, docker]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      - name: Debug release info
        run: |
          echo "GitHub ref: ${{ github.ref }}"
          echo "GitHub event: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          ls -la bin/

      - name: Create checksums
        run: |
          cd bin
          sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
