name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to (re)publish (e.g., v1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag exists
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG does not exist."
            echo "Create it locally with: make tag"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.11'

      - name: Set build time
        run: echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Run tests
        run: go test -v ./...

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          CURRENT_TAG="${{ steps.version.outputs.tag }}"
          LATEST_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "v0.0.0")

          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "current_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

          {
            echo "## What's Changed"
            echo ""
            git log --pretty=format:"- %s (%h)" "$LATEST_TAG..$CURRENT_TAG" --no-merges
            echo ""
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$LATEST_TAG...$CURRENT_TAG"
          } > CHANGELOG.md

          {
            echo 'CHANGELOG<<EOF'
            cat CHANGELOG.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.changelog.outputs.current_tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=OAuth2 Server
            org.opencontainers.image.description=Enterprise OAuth2 Authorization Server with Attestation Support
            org.opencontainers.image.vendor=HarryKodden
            org.opencontainers.image.version=${{ steps.changelog.outputs.current_tag }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.changelog.outputs.current_tag }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}

      - name: Create or update GitHub Release
        run: |
          set -euo pipefail
          TAG="${{ steps.changelog.outputs.current_tag }}"
          PRERELEASE="${{ contains(steps.changelog.outputs.current_tag, '-') }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating notes only."
            gh release edit "$TAG" \
              --title "Release $TAG" \
              --notes-file CHANGELOG.md \
              --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes-file CHANGELOG.md \
              --prerelease="$PRERELEASE"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        run: |
          set -euo pipefail
          TAG="${{ steps.changelog.outputs.current_tag }}"
          BUILD_TIME="${BUILD_TIME:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}"
          GIT_COMMIT_SHORT=$(git rev-parse --short HEAD)
          LD_FLAGS="-X main.Version=${TAG} -X main.GitCommit=${GIT_COMMIT_SHORT} -X main.BuildTime=${BUILD_TIME}"

          GOOS=linux GOARCH=amd64 go build -ldflags "${LD_FLAGS}" -o oauth2-server-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -ldflags "${LD_FLAGS}" -o oauth2-server-linux-arm64 ./cmd/server
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LD_FLAGS}" -o oauth2-server-darwin-amd64 ./cmd/server
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LD_FLAGS}" -o oauth2-server-darwin-arm64 ./cmd/server
          GOOS=windows GOARCH=amd64 go build -ldflags "${LD_FLAGS}" -o oauth2-server-windows-amd64.exe ./cmd/server

          sha256sum oauth2-server-* > checksums.txt

          gh release upload "$TAG" oauth2-server-* checksums.txt --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
